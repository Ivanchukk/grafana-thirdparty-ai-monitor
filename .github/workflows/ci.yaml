name: Local MVP verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d
      - run: docker compose wait bootstrap
      - run: docker compose --profile test run --no-deps --build --rm tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: local-aiops-app/package-lock.json
      - run: npm ci && npm run typecheck && npx playwright install --with-deps chromium
        working-directory: local-aiops-app
      - name: Browser verification
        shell: bash
        run: |
          export GRAFANA_ADMIN_PASSWORD="$(docker compose exec -T backend python -c "from pathlib import Path; print(Path('/run/ai-secrets/admin_password').read_text())")"
          echo "::add-mask::$GRAFANA_ADMIN_PASSWORD"
          cd local-aiops-app
          npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: |
            artifacts/*.png
            local-aiops-app/playwright-report/
      - if: always()
        run: docker compose down
