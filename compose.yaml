name: grafana-aiops
services:
  secrets-init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "scripts/init_secrets.py"]
    volumes:
      - ai-secrets:/run/ai-secrets

  plugin-build:
    build:
      context: ./local-aiops-app
      dockerfile: Dockerfile.build
    volumes:
      - plugin-dist:/output

  grafana:
    extends:
      file: ./local-aiops-app/docker-compose.yaml
      service: grafana
    build:
      context: ./local-aiops-app/.config
      args:
        grafana_image: grafana
        grafana_version: 13.2.4
        anonymous_auth_enabled: "false"
        development: "false"
    ports: !override
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes: !override
      - grafana-data:/var/lib/grafana
      - plugin-dist:/var/lib/grafana/plugins/local-aiops-app:ro
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - ai-secrets:/run/ai-secrets:ro
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "true"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/ai-secrets/admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_THEME: dark
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_DATAPROXY_SEND_USER_HEADER: "true"
      GF_DATAPROXY_TIMEOUT: "125"
      GF_LOG_LEVEL: info
      GF_LOG_FILTERS: ""
      GF_DATAPROXY_LOGGING: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: local-aiops-app
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      plugin-build:
        condition: service_completed_successfully
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.7.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      exporter:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  exporter:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uvicorn", "demo.exporter:app", "--host", "0.0.0.0", "--port", "9101"]
    ports:
      - "127.0.0.1:${EXPORTER_PORT:-9101}:9101"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9101/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      GRAFANA_URL: http://grafana:3000
      MOCK_AI: ${MOCK_AI:-true}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8008}:8000"
    volumes:
      - ai-secrets:/run/ai-secrets:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 25
    restart: unless-stopped

  bootstrap:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "scripts/bootstrap.py"]
    volumes:
      - ai-secrets:/run/ai-secrets
    depends_on:
      grafana:
        condition: service_healthy
      backend:
        condition: service_healthy

  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["pytest", "-q", "tests"]
    environment:
      RUN_INTEGRATION: "true"
      LIVE_AI_TEST: ${LIVE_AI_TEST:-false}
      MOCK_AI: ${MOCK_AI:-true}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    volumes:
      - ai-secrets:/run/ai-secrets:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      bootstrap:
        condition: service_completed_successfully

volumes:
  ai-secrets:
  plugin-dist:
  grafana-data:
  prometheus-data:
